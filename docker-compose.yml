services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: testdb
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d testdb"]
      interval: 5s
      timeout: 5s

  migrate:
    build: ./backend
    command: alembic upgrade head
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  nginx:
    build:
      context: ./frontend
      args:
        - VITE_API_MODE=${VITE_API_MODE:-real}
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx-test.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
